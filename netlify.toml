[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Die Zweitdomain leitet dauerhaft auf die Hauptdomain um.
# Netlify tut das bei Domain-Aliassen nicht von selbst, nur bei der www-Variante
# der Hauptdomain. Ohne diese Regeln waere die Seite unter zwei Adressen erreichbar.
[[redirects]]
  from = "https://bleib-papa.de/*"
  to = "https://bleibpapa.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://bleib-papa.de/*"
  to = "https://bleibpapa.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.bleib-papa.de/*"
  to = "https://bleibpapa.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.bleib-papa.de/*"
  to = "https://bleibpapa.de/:splat"
  status = 301
  force = true

# Die Autorenseite lief frueher unter dem vollen Namen.
[[redirects]]
  from = "/autor/jan-philip-berg/*"
  to = "/autor/jan/"
  status = 301

# Sicherheits-Header
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# Schriften und Bilder dürfen lange im Cache bleiben
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Der CMS-Bereich gehört nicht in Suchmaschinen
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
